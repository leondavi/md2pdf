name: release

# Build the macOS artifacts (.dmg, .pkg, .tar.gz) and the Windows installer,
# then attach them all to a single GitHub Release whenever a version tag is
# pushed. Can also be run manually (build only; no publish).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS artifacts
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build universal macOS artifacts
        run: bash packaging/build-macos.sh

      - name: List artifacts
        run: ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md2pdf-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (x86_64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $root = (Get-Location).Path
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path "$root\dist" | Out-Null
          # Inno resolves relative paths against the script dir, so pass absolute paths.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DBinDir=$root\target\x86_64-pc-windows-msvc\release" `
            "/DRepoDir=$root" `
            "/DIconFile=$root\assets\logo.ico" `
            "/DOutDir=$root\dist" `
            "$root\packaging\windows\md2pdf.iss"

      - name: List artifacts
        run: dir dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2pdf-windows
          path: dist/*
          if-no-files-found: error

  # Single publish step so the per-OS jobs never overwrite each other's assets.
  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.pkg' -o -name '*.tar.gz' -o -name '*setup.exe' \) \
            -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
